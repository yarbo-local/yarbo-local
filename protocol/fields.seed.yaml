# Curated DeviceMSG semantics: the part of the field map that is knowledge, not
# inventory. Edit by hand or through the Studio's Knowledge pane; then run
# scripts/gen_fields.py to regenerate fields.yaml, which merges this with what
# the fixtures actually show.
#
# Keys per path: entity (sensor, binary_sensor, switch, number, light,
# device_tracker, update, or null), device_class, unit, scale, sentinel,
# enabled, category, codes (a key in codes.yaml), heads, notes, source.
# source 'capture' means we confirmed the semantics on our own robot and the
# path becomes verified in fields.yaml.

version: 1
