# Enum tables. Source: vendor SDK sensor.py maps and yarbo_Y.json. Status: candidate
# until a fixture shows each value on the wire.

version: 0

StateMSG.on_going_planning:
  0: not_started
  1: working            # verb depends on head: mowing, blowing snow, blowing leaves
  2: calculating_route
  3: heading_to_area
  5: completed
  11: waypoint_navigation
  12: waypoint_complete
  negative: error       # -2 plan history, -10 plan not found, -12 route calc, -20 outside map,
                        # -23/-88 no-go zone, -24 low battery, -31 dock exception, -42/-44/-47/-92 boundary
  running_rule: "> 0 and != 5"

StateMSG.planning_paused:
  0: not_paused
  1: manual
  2: low_battery_recharging
  3: power_restart
  4: emergency_stop
  5: bumper
  6: stuck
  7: error

StateMSG.on_going_recharging:
  0: not_started
  1: returning_on_path
  2: returning_in_area
  3: repositioning
  4: charging
  99: verifying
  negative: error
  in_transit_rule: "> 0 and != 4"

BodyMsg.recharge_state:
  # Community mapping (1 wired_charging, 3 wired_charging_locked, blocks plan start)
  # is contradicted on 3.14.11: the value was 3 while the robot sat free-standing in
  # the garage, off any charger, with BatteryMSG.status 1, StateMSG.charging_status 0
  # and the pack discharging at 0.3 A. Meaning unknown until captured on and off the dock.
  observed: [3]
  notes: do not derive charging from this field


BatteryMSG.status:
  charging_rule: "> 1"
  notes: wireless dock charging; does not block plan start, the robot undocks itself

RTKMSG.status:
  4: strong
  5: medium
  other: weak
  plan_start_requires: [4, 5]

HeadMsg.head_type:
  0: none
  1: snow_blower
  2: leaf_blower
  3: mower
  4: smart_cover
  5: mower_pro
  99: trimmer

heart_beat.working_state:
  0: asleep
  1: awake

GGA.fix_quality:
  0: none
  1: gps
  2: dgps
  4: rtk_fixed
  5: rtk_float
  6: dead_reckoning
