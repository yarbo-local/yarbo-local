# Enum tables. Source: vendor SDK sensor.py maps and yarbo_Y.json. Status: candidate
# until a fixture shows each value on the wire.

version: 0

StateMSG.on_going_planning:
  0: not_started
  1: working            # verb depends on head: mowing, blowing snow, blowing leaves
  2: calculating_route  # seen for about a second after start_plan (2026-09-18)
  3: heading_to_area    # seen: follows 2, lasts until the robot reaches the area
  5: completed          # seen only in plan_feedback.state (2026-09-18); the state frame goes 1 -> 0
  11: waypoint_navigation
  12: waypoint_complete
  negative: error       # words live in models.PLAN_ERRORS, only for codes whose app text was seen (-12)
                        # -2 plan history, -10 plan not found, -12 route calc, -20 outside map,
                        # -12 seen 2026-09-18 where the app showed WP005 "Failed to calculate route": the
                        # area's pathway was not linked to the dock. The code stays latched until the next start.
                        # -23/-88 no-go zone, -24 low battery, -31 dock exception, -42/-44/-47/-92 boundary
  running_rule: "> 0 and != 5"

StateMSG.planning_paused:
  0: not_paused
  1: manual             # seen after app/pause (2026-09-18)
  2: low_battery_recharging
  3: power_restart
  4: emergency_stop
  5: bumper
  6: stuck
  7: fault              # seen on the wire with StateMSG.error_code 902 (2026-09-15)
  9: rain               # 2026-09-26, fw 3.14.11: app/start_plan of the East Lawn plan from the
                        # dock; 1 s later charging stopped (on_going_recharging 4->0,
                        # charging_status 2->0), 4 s later planning_paused 0->9,
                        # charging_status 0->6, plan_msg "cancel ". on_going_planning stayed 0
                        # and no data_feedback came for start_plan. The app showed
                        # "Rain detected". RTK was fixed (status 4, ~30 satellites). The app
                        # then sent clear_plan_state {"state": 9}; the robot stayed paused 9.

StateMSG.error_code:
  # The robot sends only the number; the Yarbo app owns the wording. A code is listed
  # with a key only after the app's text for it was seen on a real robot. The text
  # lives in models.FAULTS.
  0: none
  902: tilted           # app: "Tilted or flipped over". 2026-09-15, fw 3.14.11, Mower Pro,
                        # West Lawn plan. on_going_planning 1->0, planning_paused 0->7,
                        # plan_msg "Goal canceled", head gyro pitch about 2 -> 12 deg.
                        # Cleared when the plan was resumed from the app 4 min later.
                        # Fixture: mower-pro-fault-902-tilted.jsonl
  observed_unidentified:
    901: "2026-09-14 East Lawn plan, 17:45-19:59; the run ended at 79%"

StateMSG.charging_status:
  2: charging           # the only value seen with current into the pack: up to +14.3 A,
                        # BatteryMSG.status 3 (all captures to 2026-09-26)
  observed:
    0: "off the dock, and on the dock at 100% with the pack at -0.3 A"
    1: "on the dock before charging began, pack at -0.5 A"
    6: "2026-09-26, on the dock while a start was held for rain (paused 9), pack at -0.4 A, BatteryMSG.status 1"
  charging_rule: "== 2"

StateMSG.on_going_recharging:
  0: not_started
  1: returning_on_path
  2: returning_in_area
  3: repositioning
  4: charging
  99: verifying
  negative: error
  in_transit_rule: "> 0 and != 4"

BodyMsg.recharge_state:
  # Community mapping (1 wired_charging, 3 wired_charging_locked, blocks plan start)
  # is contradicted on 3.14.11: the value was 3 while the robot sat free-standing in
  # the garage, off any charger, with BatteryMSG.status 1, StateMSG.charging_status 0
  # and the pack discharging at 0.3 A. On the dock at 100% it read 0. Meaning unknown;
  # it tracks docking somehow, the opposite way round from the community mapping.
  observed: {off_dock: 3, on_dock_full: 0}
  notes: do not derive charging from this field


BatteryMSG.status:
  charging_rule: "> 1"
  notes: wireless dock charging; does not block plan start, the robot undocks itself

RTKMSG.status:
  4: strong
  5: medium
  other: weak
  plan_start_requires: [4, 5]

HeadMsg.head_type:
  0: none
  1: snow_blower
  2: leaf_blower
  3: mower
  4: smart_cover
  5: mower_pro
  99: trimmer

heart_beat.working_state:
  0: asleep
  1: awake

GGA.fix_quality:
  0: none
  1: gps
  2: dgps
  4: rtk_fixed
  5: rtk_float
  6: dead_reckoning
