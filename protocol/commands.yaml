  read_global_params:
    payload: {id: 1}
    ack: data_feedback
    controller: false
    risk: safe
    status: verified
    firmware: "3.14.11"
    evidence: fixtures/3.14.11/read_global_params-id1.jsonl
    verified_notes: >
      Requires {id: 1}; with {} the reply is state -2 (fixtures/3.14.11/read_global_params-no-id-error.jsonl).
      Returns ~60 global settings: battery cut-offs, plan_speed, max_vel, enable_elec_fence, chute limits, rain thresholds.
    source: steves2j cached sample

  read_schedules:
    payload: {}
    ack: data_feedback
    controller: false
    risk: safe
    status: verified
    firmware: "3.14.11"
    evidence: fixtures/3.14.11/read_schedules-asleep.jsonl
    verified_notes: "Reply data is a bare list, not {data: [...]}."
    source: bridge headers

  get_all_map_backup:
    payload: {}
    ack: data_feedback
    controller: false
    risk: safe
    status: verified
    firmware: "3.14.11"
    evidence: fixtures/3.14.11/get_all_map_backup-asleep.jsonl
    verified_notes: "data is a base64 string of zlib JSON, same envelope as get_map."
    source: bridge headers

  read_recharge_point:
    payload: {}
    ack: data_feedback
    controller: false
    risk: safe
    status: verified
    firmware: "3.14.11"
    evidence: fixtures/3.14.11/read_recharge_point-asleep.jsonl
    verified_notes: "Dock record {chargingPoint{x,y,phi}, startPoint{x,y,phi}, straightPhi (radians), hasChargingStation, enable, id, name}."
    source: python-yarbo

