# Yarbo local MQTT command registry.
# Topic: snowbot/{sn}/app/<name>. Replies arrive on snowbot/{sn}/device/data_feedback
# as {"topic": "<name>", "state": 0, "msg": "...", "data": ...} unless ack says otherwise.
#
# status: verified | candidate      (see README.md for the evidence rule)
# ack:    data_feedback | plan_feedback | recharge_feedback | none
# risk:   safe | confirm             (forbidden commands are listed at the bottom, unregistered)
# source: where the knowledge came from, until a fixture replaces it.

version: 1
firmware_note: >
  Payloads are zlib-compressed JSON on firmware >= 3.9.0 and plain JSON before that.
  heart_beat is always plain. Sending the wrong encoding is dropped silently.

commands:
  get_device_msg:
    payload: {}
    ack: data_feedback
    controller: false
    awake: false
    risk: safe
    status: verified
    firmware: "3.14.11"
    evidence: fixtures/3.14.11/get_device_msg-asleep.jsonl
    verified_notes: >
      Answers while asleep, 52 ms. 52 top-level objects vs 29 in the push. Same via the base station endpoint.
    notes: Reply data is the full DeviceMSG snapshot, including sub-objects the push omits.
    source: vendor SDK, python-yarbo capture 2026-03-06

  get_state_msg:
    payload: {}
    ack: data_feedback
    controller: false
    risk: safe
    status: verified
    firmware: "3.14.11"
    evidence: fixtures/3.14.11/get_state_msg-asleep.jsonl
    verified_notes: >
      Reply data is {value: [33 ints]}, semantics unknown.
    source: steves2j bridge headers

  get_controller:
    payload: {}
    ack: data_feedback
    controller: n/a
    risk: safe
    status: verified
    firmware: 3.14.11
    evidence: fixtures/3.14.11/get_controller.jsonl
    notes: >-
      Takes the single controller role from whoever holds it, including the phone app, so
      only commands that need it may trigger it; reads never do. Answered in about 40 ms on
      2026-09-15 with state 0 and the acknowledgement text the session checks for.
      StateMSG.machine_controller read 1 before and after, so it does not show who holds it.
    source: python-yarbo, vendor SDK; verified on the robot

  set_working_state:
    payload: {state: 1, source: smart_home}
    ack: none
    controller: unknown
    risk: safe
    status: verified
    firmware: "3.14.11"
    evidence: fixtures/3.14.11/set_working_state-wake.jsonl
    verified_notes: >
      No ack. DeviceMSG streams at 1 Hz within seconds; heart_beat flips to 1 every 2 s. No controller needed. Robot sleeps again ~200 s after the last stimulus.
    notes: >
      What the vendor integration sends to wake the robot over the cloud relay.
      Never captured on the LAN. Phase 0 question 2.
    source: vendor SDK modules.py

  read_all_plan:
    payload: {}
    ack: data_feedback
    controller: false
    awake: false
    risk: safe
    status: verified
    firmware: "3.14.11"
    evidence: fixtures/3.14.11/read_all_plan-asleep.jsonl
    verified_notes: >
      Answers while asleep in 44 ms. Reply {data: [...]}.
    notes: Reply data.data is a list of {id, name, areaIds, enable_self_order}. Often unanswered when asleep.
    source: vendor SDK, jtubb fork

  read_gps_ref:
    payload: {}
    ack: data_feedback
    controller: false
    risk: safe
    status: verified
    firmware: "3.14.11"
    evidence: fixtures/3.14.11/read_gps_ref-asleep.jsonl
    verified_notes: >
      Answers while asleep. data: {ref:{latitude,longitude}, hgt, rtkFixType, lat_lon_hight}.
    notes: Reply data has ref.latitude, ref.longitude, rtkFixType (1 = fixed).
    source: vendor SDK

  get_map:
    payload: {width: 256, height: 256}
    ack: data_feedback
    controller: false
    risk: safe
    status: verified
    firmware: "3.14.11"
    evidence: fixtures/3.14.11/get_map-asleep.jsonl
    verified_notes: >
      Answers while asleep in 43 ms. On 3.14.11 data is a base64 string of zlib JSON. Keys: allchargingData, chargingData, areas, nogozones, novisionzones, elec_fence, pathways, sidewalks, deadends, mul_points.
    notes: >
      Reply data is a JSON object, a JSON string, or base64 zlib depending on firmware.
      Object keys: areas, nogozones, pathways, sidewalks, elec_fence, deadends,
      novisionzones, allchargingData.
    source: steves2j bridge headers, vendor SDK

  get_plan_feedback:
    payload: {}
    ack: data_feedback   # when idle; plan_feedback push while a plan runs is still unverified
    controller: false
    risk: safe
    status: verified
    firmware: "3.14.11"
    evidence: fixtures/3.14.11/get_plan_feedback-idle.jsonl
    verified_notes: >
      With no plan running it replies on data_feedback with state -1 and msg 'no plan working', not on plan_feedback.
    source: steves2j bridge headers, jtubb fork

  start_plan:
    payload: {id: int, percent: int}
    ack: plan_feedback
    controller: true
    awake: true
    risk: safe
    status: verified
    firmware: 3.14.11
    evidence: fixtures/3.14.11/plan-start-from-dock.jsonl
    notes: >-
      Sent by the app on 2026-09-18 as {"id": 1, "percent": 0}, percent included even when 0. There is
      no data_feedback. On success on_going_planning goes to 2 within a second, to 3 a second later and
      to 1 once the robot reaches the area; car_controller turns true and plan_feedback starts at once
      with state 3. On failure the planning code goes to a negative value and nothing else is said: see
      fixtures/3.14.11/plan-start-fails-route-wp005.jsonl, where -12 is what the app shows as WP005,
      "Failed to calculate route". The app sent no get_controller; before each start it sent
      check_map_connectivity {"ids": [area]} and got three empty lists whether or not the start worked.
      percent values other than 0 have not been seen.
    source: vendor SDK, jtubb fork; observed from the app

  pause:
    payload: {}
    ack: plan_feedback
    controller: true
    awake: true
    risk: safe
    status: verified
    firmware: 3.14.11
    evidence: fixtures/3.14.11/plan-pause-resume-app.jsonl
    notes: >-
      Sent by the app on 2026-09-18. Half a second later on_going_planning went 1 to 0 with
      planning_paused 1 (manual), plan_msg "Goal canceled " for one frame and car_controller false.
      There is no data_feedback. resume {} brought planning straight back to 1 within a second.
    source: bridge headers; observed from the app

  resume:
    payload: {}
    ack: plan_feedback
    controller: true
    awake: true
    risk: safe
    status: verified
    firmware: 3.14.11
    evidence: fixtures/3.14.11/mower-pro-run-faults-estop.jsonl
    notes: >-
      Sent by the app eight times on 2026-09-15, and each time the robot left planning_paused
      (7 after a fault, 4 after an emergency stop) for on_going_planning 3 or 1 within two
      seconds. There is no data_feedback; the state change is the acknowledgement. It does not
      work once the robot has slept on a fault: then it answers plan_msg "Goal canceled" and
      stays paused, and cmd_recharge is what clears it. Only ever sent to an awake robot.
    source: bridge headers; observed from the app

  stop:
    payload: {}
    ack: plan_feedback
    controller: true
    awake: true
    risk: safe
    status: verified
    firmware: 3.14.11
    evidence: fixtures/3.14.11/plan-start-then-stop.jsonl
    notes: >-
      Sent by us on 2026-09-18, six seconds after our own start_plan, while the robot was heading
      to the area: on_going_planning went 3 to 0 within a second, with no pause code and no
      data_feedback, exactly as when Stop was pressed in the app in the same phase. Sent again while
      the robot was mowing (fixtures/3.14.11/plan-stop-while-mowing.jsonl): planning 1 to 0 within a
      second, plan_msg "Goal canceled ", and no pause code at any point. When Stop was pressed in the
      app while mowing, the state read as a pause first (planning_paused 1) and cleared four seconds
      later, so the app evidently pauses and then stops; see plan-stopped-from-app-effects-only.jsonl,
      where the app's own publishes went through the vendor's cloud and were not seen. The robot stays
      where it is; it does not go home. The payload {} comes from the community projects.
    source: bridge headers; sent by us

  cmd_recharge:
    payload: {cmd: 2}
    ack: recharge_feedback
    controller: true
    awake: true
    risk: safe
    status: verified
    firmware: 3.14.11
    evidence: fixtures/3.14.11/return-to-dock-from-fault.jsonl
    notes: >-
      cmd 2 works. Sent on 2026-09-15 while fault 902 was latched: within a second the fault
      cleared and on_going_recharging went to 1, so it also clears a latched fault, which
      resume alone did not. cmd 1 is still untested.
    source: vendor SDK modules.py, steves2j cache; verified on the robot

