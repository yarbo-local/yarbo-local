# Yarbo local MQTT command registry.
# Topic: snowbot/{sn}/app/<name>. Replies arrive on snowbot/{sn}/device/data_feedback
# as {"topic": "<name>", "state": 0, "msg": "...", "data": ...} unless ack says otherwise.
#
# status: verified | candidate      (see README.md for the evidence rule)
# ack:    data_feedback | plan_feedback | recharge_feedback | none
# risk:   safe | confirm             (forbidden commands are listed at the bottom, unregistered)
# source: where the knowledge came from, until a fixture replaces it.

version: 1
firmware_note: >
  Payloads are zlib-compressed JSON on firmware >= 3.9.0 and plain JSON before that.
  heart_beat is always plain. Sending the wrong encoding is dropped silently.

commands:
  get_device_msg:
    payload: {}
    ack: data_feedback
    controller: false
    awake: false
    risk: safe
    status: verified
    firmware: "3.14.11"
    evidence: fixtures/3.14.11/get_device_msg-asleep.jsonl
    verified_notes: >
      Answers while asleep, 52 ms. 52 top-level objects vs 29 in the push. Same via the base station endpoint.
    notes: Reply data is the full DeviceMSG snapshot, including sub-objects the push omits.
    source: vendor SDK, python-yarbo capture 2026-03-06

  get_state_msg:
    payload: {}
    ack: data_feedback
    controller: false
    risk: safe
    status: verified
    firmware: "3.14.11"
    evidence: fixtures/3.14.11/get_state_msg-asleep.jsonl
    verified_notes: >
      Reply data is {value: [33 ints]}, semantics unknown.
    source: steves2j bridge headers

  get_controller:
    payload: {}
    ack: data_feedback
    controller: n/a
    risk: safe
    status: candidate
    notes: Takes the single controller role from whoever holds it, including the phone app.
    source: python-yarbo, vendor SDK

  set_working_state:
    payload: {state: 1, source: smart_home}
    ack: none
    controller: unknown
    risk: safe
    status: verified
    firmware: "3.14.11"
    evidence: fixtures/3.14.11/set_working_state-wake.jsonl
    verified_notes: >
      No ack. DeviceMSG streams at 1 Hz within seconds; heart_beat flips to 1 every 2 s. No controller needed. Robot sleeps again ~200 s after the last stimulus.
    notes: >
      What the vendor integration sends to wake the robot over the cloud relay.
      Never captured on the LAN. Phase 0 question 2.
    source: vendor SDK modules.py

  read_all_plan:
    payload: {}
    ack: data_feedback
    controller: false
    awake: false
    risk: safe
    status: verified
    firmware: "3.14.11"
    evidence: fixtures/3.14.11/read_all_plan-asleep.jsonl
    verified_notes: >
      Answers while asleep in 44 ms. Reply {data: [...]}.
    notes: Reply data.data is a list of {id, name, areaIds, enable_self_order}. Often unanswered when asleep.
    source: vendor SDK, jtubb fork

  read_gps_ref:
    payload: {}
    ack: data_feedback
    controller: false
    risk: safe
    status: verified
    firmware: "3.14.11"
    evidence: fixtures/3.14.11/read_gps_ref-asleep.jsonl
    verified_notes: >
      Answers while asleep. data: {ref:{latitude,longitude}, hgt, rtkFixType, lat_lon_hight}.
    notes: Reply data has ref.latitude, ref.longitude, rtkFixType (1 = fixed).
    source: vendor SDK

  get_map:
    payload: {width: 256, height: 256}
    ack: data_feedback
    controller: false
    risk: safe
    status: verified
    firmware: "3.14.11"
    evidence: fixtures/3.14.11/get_map-asleep.jsonl
    verified_notes: >
      Answers while asleep in 43 ms. On 3.14.11 data is a base64 string of zlib JSON. Keys: allchargingData, chargingData, areas, nogozones, novisionzones, elec_fence, pathways, sidewalks, deadends, mul_points.
    notes: >
      Reply data is a JSON object, a JSON string, or base64 zlib depending on firmware.
      Object keys: areas, nogozones, pathways, sidewalks, elec_fence, deadends,
      novisionzones, allchargingData.
    source: steves2j bridge headers, vendor SDK

  get_plan_feedback:
    payload: {}
    ack: data_feedback   # when idle; plan_feedback push while a plan runs is still unverified
    controller: false
    risk: safe
    status: verified
    firmware: "3.14.11"
    evidence: fixtures/3.14.11/get_plan_feedback-idle.jsonl
    verified_notes: >
      With no plan running it replies on data_feedback with state -1 and msg 'no plan working', not on plan_feedback.
    source: steves2j bridge headers, jtubb fork

  start_plan:
    payload: {id: int, percent: int}
    ack: plan_feedback
    controller: true
    awake: true
    risk: safe
    status: candidate
    notes: percent 0 to 99, omitted when 0 in the jtubb fork.
    source: vendor SDK, jtubb fork

  pause:
    payload: {}
    ack: plan_feedback
    controller: true
    risk: safe
    status: candidate
    source: bridge headers

  resume:
    payload: {}
    ack: plan_feedback
    controller: true
    risk: safe
    status: candidate
    source: bridge headers

  stop:
    payload: {}
    ack: plan_feedback
    controller: true
    risk: safe
    status: candidate
    source: bridge headers

  cmd_recharge:
    payload: {cmd: 2}
    ack: recharge_feedback
    controller: true
    risk: safe
    status: candidate
    notes: cmd is 2 in the app and vendor SDK, 1 in the bridge header example. Phase 0 question.
    source: vendor SDK modules.py, steves2j cache

  cmd_buzzer:
    payload: {state: 1, timeStamp: ms}
    ack: none
    controller: true
    risk: safe
    status: candidate
    source: python-yarbo

  song_cmd:
    payload: {song_name: find yarbo}
    ack: none
    controller: true
    risk: safe
    status: candidate
    source: vendor SDK

  light_ctrl:
    payload: {led_head: 0-255, led_left_w: 0-255, led_right_w: 0-255, body_left_r: 0-255, body_right_r: 0-255, tail_left_r: 0-255, tail_right_r: 0-255}
    ack: none
    controller: true
    risk: safe
    status: candidate
    source: python-yarbo, vendor SDK (sends led_head only)

  set_sound_param:
    payload: {enable: bool, vol: 0.0-1.0, mode: 0}
    ack: data_feedback
    controller: true
    risk: safe
    status: candidate
    notes: vol scale disputed (0-1 in vendor SDK, 0-100 in bridge example). Phase 0 question.
    source: vendor SDK

  set_person_detect:
    payload: {state: 0|1}
    ack: data_feedback
    controller: true
    risk: safe
    status: candidate
    source: vendor SDK

  set_child_lock:
    payload: {state: bool}
    ack: data_feedback
    controller: true
    risk: safe
    status: candidate
    source: vendor SDK

  set_follow_state:
    payload: {state: 0|1}
    ack: data_feedback
    controller: true
    risk: safe
    status: candidate
    source: vendor SDK

  save_global_params:
    payload: {id: 1, enable_elec_fence: bool}
    ack: data_feedback
    controller: true
    risk: confirm
    status: candidate
    source: vendor SDK

  set_map_obstacle_switch:
    payload: {switch: 0|1}
    ack: data_feedback
    controller: true
    risk: safe
    status: candidate
    source: vendor SDK

  mower_target_cmd:
    payload: {target: mm}
    ack: none
    controller: true
    heads: [3, 5]
    risk: safe
    status: candidate
    source: vendor SDK

  mower_speed_cmd:
    payload: {state: percent}
    ack: none
    controller: true
    heads: [3, 5]
    risk: safe
    status: candidate
    source: vendor SDK

  cmd_set_chute_angle:
    payload: {cmd: degrees}
    ack: none
    controller: true
    heads: [1]
    risk: safe
    status: candidate
    source: vendor SDK

  read_all_nogozone:
    payload: {}
    ack: data_feedback
    controller: false
    risk: safe
    status: verified
    firmware: "3.14.11"
    evidence: fixtures/3.14.11/read_all_nogozone-asleep.jsonl
    verified_notes: >
      Answers while asleep. Reply {data: [...]}.
    source: jtubb fork
  read_all_clean_area:
    payload: {}
    ack: data_feedback
    controller: false
    risk: safe
    status: verified
    firmware: "3.14.11"
    evidence: fixtures/3.14.11/read_all_clean_area-asleep.jsonl
    verified_notes: >
      Answers while asleep. Reply {data: [...]}.
    source: jtubb fork
  read_all_pathway:
    payload: {}
    ack: data_feedback
    controller: false
    risk: safe
    status: verified
    firmware: "3.14.11"
    evidence: fixtures/3.14.11/read_all_pathway-asleep.jsonl
    verified_notes: >
      Answers while asleep. Reply {data: [...]}.
    source: bridge headers
  read_all_sidewalk:
    payload: {}
    ack: data_feedback
    controller: false
    risk: safe
    status: verified
    firmware: "3.14.11"
    evidence: fixtures/3.14.11/read_all_sidewalk-asleep.jsonl
    verified_notes: >
      Answers while asleep. Reply {data: [...]}.
    source: bridge headers

  save_nogozone:
    payload: {id: int (omit to create), name: str, type: 0, enable: bool, range: [{x, y, phi}], ref: {latitude, longitude}, trimming_edges: []}
    ack: data_feedback
    controller: true
    risk: confirm
    status: candidate
    notes: Full record every time; omit id to create. First vertex repeated to close the polygon.
    source: steves2j editor, jtubb fork
  save_pathway:
    payload: {id: int (omit to create), name: str, range: [{x, y, phi}], ref: {latitude, longitude}, connectids: [], leaf_piles: [], snowPiles: [], trimming_edges: []}
    ack: data_feedback
    controller: true
    risk: confirm
    status: candidate
    source: steves2j editor
  save_sidewalk:
    payload: {id: int (omit to create), name: str, head_type: 99, range: [{x, y, phi}], ref: {latitude, longitude}, connectids: [], snowPiles: [], trimming_edges: [{id, ref, range}]}
    ack: data_feedback
    controller: true
    risk: confirm
    status: candidate
    source: steves2j editor
  del_nogozone:
    payload: {id: int}
    ack: data_feedback
    controller: true
    risk: confirm
    status: candidate
    source: bridge headers
  del_pathway:
    payload: {id: int}
    ack: data_feedback
    controller: true
    risk: confirm
    status: candidate
    source: bridge headers
  del_sidewalk:
    payload: {id: int}
    ack: data_feedback
    controller: true
    risk: confirm
    status: candidate
    source: bridge headers

  emergency_stop_active:
    payload: {}
    ack: none
    controller: true
    risk: confirm
    status: candidate
    source: python-yarbo
  emergency_unlock:
    payload: {}
