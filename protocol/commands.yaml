    status: candidate
    notes: Full record every time; omit id to create. First vertex repeated to close the polygon.
    source: steves2j editor, jtubb fork
  save_pathway:
    payload: {id: int (omit to create), name: str, range: [{x, y, phi}], ref: {latitude, longitude}, connectids: [], leaf_piles: [], snowPiles: [], trimming_edges: []}
    ack: data_feedback
    controller: unknown
    risk: confirm
    status: candidate
    observed: fixtures/3.14.11/mapping-area-app.jsonl
    notes: >
      Observed from the phone app on 3.14.11 creating "Pathway 1" (5 vertices) after the area was saved, acked
      state 0. The app sent no get_controller during the session. The stored record gains start_id, end_id and
      connectd_points, which the app does not send.
      Sent by us on 2026-09-18 with an existing id: it edits the pathway in place and the reply carries the
      recomputed links. start_id 0 is the dock. The robot links a pathway to the dock only when its first point
      is close to the charging point: 0.27 m linked, 0.31 m did not, and moving that point onto the charging
      point turned start_id -1 into 0. Several pathways may hold the dock link. A pathway without it makes
      every start from the dock fail with on_going_planning -12 (WP005). Still a candidate: one send.
    source: steves2j editor; app capture 2026-09-14
  save_sidewalk:
